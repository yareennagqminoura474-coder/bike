<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JXNU 智行 | 共享单车智能调度仿真系统</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet.heat 热力图插件 -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1920px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 顶部标题栏 */
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 控制面板 */
        .control-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .time-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .time-display {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            min-width: 120px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .btn-play {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-pause {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-reset {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-control input[type="range"] {
            width: 150px;
        }

        /* 选项卡导航 */
        .tabs {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .tab {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            background: #f0f0f0;
            color: #333;
            white-space: nowrap;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab:hover {
            transform: translateY(-2px);
        }

        /* 内容区域 */
        .content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            min-height: 600px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card .label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
        }

        /* 地图容器 */
        /* --- 🔴 修改这里：给所有地图容器设置统一的高度 --- */
        #map, #dispatchMap, #heatmapContainer {
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative; /* 确保图层叠加正确 */
            background-color: #e5e5e5; /* 增加一个灰色背景，防止图片加载慢时一片白 */
        }

        /* 图表容器 */
        .chart-container {
            height: 400px;
            margin-bottom: 20px;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        /* 站点信息弹窗 */
        .leaflet-popup-content {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .popup-title {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .popup-info {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        /* 调度面板 */
        .dispatch-panel {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .dispatch-route {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin: 20px 0;
        }

        .station-info {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .arrow {
            font-size: 32px;
            color: #667eea;
        }

        /* 告警信息 */
        .alert {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            color: #856404;
        }

        .alert-danger {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .chart-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                overflow-x: auto;
            }
        }

        /* 自定义标记样式 */
        .bike-marker {
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .marker-green {
            background-color: #3cb371;
        }

        .marker-blue {
            background-color: #1e90ff;
        }

        .marker-red {
            background-color: #dc143c;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题栏 -->
        <div class="header">
            <h1>🚲 JXNU 智行 | 共享单车智能调度仿真系统</h1>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <div class="time-controls">
                <div class="time-display" id="currentTime">07:00</div>
                <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶ 开始仿真</button>
                <button class="btn btn-reset" onclick="resetSimulation()">🔄 重置</button>
                <div class="speed-control">
                    <label>⚡ 倍速:</label>
                    <input type="range" id="speedSlider" min="1" max="20" value="5" oninput="updateSpeed(this.value)">
                    <span id="speedValue">5x</span>
                </div>
            </div>
        </div>

        <!-- 选项卡 -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('overview')">📊 全局态势</button>
            <button class="tab" onclick="switchTab('timeline')">📈 时序分析</button>
            <button class="tab" onclick="switchTab('dispatch')">🚚 智能调度</button>
            <button class="tab" onclick="switchTab('heatmap')">🔥 热力分析</button>
            <button class="tab" onclick="switchTab('dashboard')">⚡ 性能仪表盘</button>
        </div>

        <!-- 内容区 -->
        <div class="content">
            <!-- 全局态势 -->
            <div id="overview" class="tab-content active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="label">🚲 总库存</div>
                        <div class="value" id="totalBikes">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">🚴 在途车辆</div>
                        <div class="value" id="activeBikes">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">⚠️ 缺车站点</div>
                        <div class="value" id="shortageStations">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">📦 积压站点</div>
                        <div class="value" id="surplusStations">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">✅ 正常站点</div>
                        <div class="value" id="normalStations">0</div>
                    </div>
                </div>
                <div id="map"></div>
            </div>

            <!-- 时序分析 -->
            <div id="timeline" class="tab-content">
                <div class="chart-grid">
                    <div class="chart-container" id="trendChart"></div>
                    <div class="chart-container" id="stationChart"></div>
                </div>
                <div class="chart-container" id="predictChart"></div>
            </div>

            <!-- 智能调度 -->
            <div id="dispatch" class="tab-content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="label">🎯 调出站点</div>
                        <div class="value" id="dispatchFrom">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">📍 调入站点</div>
                        <div class="value" id="dispatchTo">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">🚚 建议调度量</div>
                        <div class="value" id="dispatchAmount">0</div>
                    </div>
                </div>
                <div id="dispatchMap"></div>
                <div class="dispatch-panel">
                    <button class="btn btn-play" onclick="executeDispatch()" style="width: 100%;">✅ 执行调度方案</button>
                    <div id="dispatchHistory" style="margin-top: 20px;"></div>
                </div>
            </div>

            <!-- 热力分析 -->
            <div id="heatmap" class="tab-content">
                <div id="heatmapContainer"></div>
                <div class="chart-container" id="utilizationChart" style="margin-top: 20px;"></div>
            </div>

            <!-- 性能仪表盘 -->
            <div id="dashboard" class="tab-content">
                <div class="chart-grid">
                    <div class="chart-container" id="gaugeUtilization"></div>
                    <div class="chart-container" id="gaugeShortage"></div>
                    <div class="chart-container" id="gaugeSurplus"></div>
                </div>
                <div id="alertsContainer" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <script src="simulation.js"></script>
</body>
</html>
